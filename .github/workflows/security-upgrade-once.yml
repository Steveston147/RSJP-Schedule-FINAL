name: Security upgrade and verify once

on:
  push:
    branches:
      - audit/production-readiness

permissions:
  contents: write

jobs:
  upgrade-verify-record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/production-readiness

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Upgrade security baseline
        run: |
          npm install --save-exact next@15.5.21 react@19.1.9 react-dom@19.1.9
          npm install --save-dev --save-exact eslint-config-next@15.5.21 @types/react@19 @types/react-dom@19

      - name: Clean install from updated lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify completion ceremony regression fix
        shell: bash
        run: |
          grep -F '...makeItemBase(program, program.endDate),' components/ScheduleApp.tsx

      - name: Record upgrade and remove one-time workflow
        shell: bash
        run: |
          VERIFIED_SHA="$(git rev-parse HEAD)"
          VERIFIED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          NEXT_VERSION="$(node -p "require('./node_modules/next/package.json').version")"
          REACT_VERSION="$(node -p "require('./node_modules/react/package.json').version")"
          REACT_DOM_VERSION="$(node -p "require('./node_modules/react-dom/package.json').version")"
          cat > docs/SECURITY_UPGRADE.md <<EOF
          # RSJP Schedule — Security Upgrade Verification

          Result: **PASS**

          - Source commit verified: \`${VERIFIED_SHA}\`
          - Verified at (UTC): \`${VERIFIED_AT}\`
          - Node.js: 20
          - Next.js: \`${NEXT_VERSION}\`
          - React: \`${REACT_VERSION}\`
          - React DOM: \`${REACT_DOM_VERSION}\`
          - Clean install: \`npm ci\`
          - Lint: \`npm run lint\`
          - Production build: \`npm run build\`
          - Completion ceremony regression assertion: PASS

          This file is written only after all verification steps above complete successfully in GitHub Actions.
          EOF
          git rm .github/workflows/security-upgrade-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json docs/SECURITY_UPGRADE.md
          git commit -m "security: upgrade Next and React baseline with verification"
          git push origin HEAD:audit/production-readiness
