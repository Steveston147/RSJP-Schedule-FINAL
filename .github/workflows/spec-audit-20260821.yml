name: Apply RSJP Schedule specification audit

on:
  push:
    branches: ["audit/rsjp-schedule-20260821"]
    paths:
      - "scripts/apply-spec-audit-20260821.py"
      - ".github/workflows/spec-audit-20260821.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/rsjp-schedule-20260821
      - run: python scripts/apply-spec-audit-20260821.py
      - name: Commit audited changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- components/ScheduleApp.tsx app/layout.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: validate RSJP Schedule backup imports"
          git push origin HEAD:audit/rsjp-schedule-20260821
