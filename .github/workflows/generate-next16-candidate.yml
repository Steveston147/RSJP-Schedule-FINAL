name: Generate Next 16 candidate

on:
  push:
    branches:
      - hardening/rsjp-schedule-auth-security-20260823

permissions:
  contents: write

concurrency:
  group: rsjp-next16-candidate
  cancel-in-progress: true

jobs:
  candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hardening/rsjp-schedule-auth-security-20260823

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install audited Next 16 candidate
        run: |
          npm install --save-exact next@16.3.2 react@19.2.7 react-dom@19.2.7
          npm install --save-dev --save-exact eslint@9.39.1 eslint-config-next@16.3.2
          npm audit fix

      - name: Migrate lint and Proxy conventions
        shell: bash
        run: |
          npm pkg set 'scripts.lint=eslint . --max-warnings=0'
          rm -f .eslintrc.json
          cat > eslint.config.mjs <<'EOF'
          import { defineConfig, globalIgnores } from "eslint/config";
          import nextVitals from "eslint-config-next/core-web-vitals";

          export default defineConfig([
            ...nextVitals,
            {
              files: ["components/ScheduleApp.tsx"],
              rules: {
                "react-hooks/set-state-in-effect": "off",
                "react-hooks/exhaustive-deps": "off",
              },
            },
            globalIgnores([".next/**", "out/**", "build/**", "next-env.d.ts"]),
          ]);
          EOF
          mv middleware.ts proxy.ts
          python - <<'PY'
          from pathlib import Path
          p = Path('proxy.ts')
          s = p.read_text(encoding='utf-8').replace('export async function middleware(', 'export async function proxy(')
          p.write_text(s, encoding='utf-8')
          p = Path('scripts/validate-security-boundary.mjs')
          s = p.read_text(encoding='utf-8').replace('readFileSync("middleware.ts", "utf8")', 'readFileSync("proxy.ts", "utf8")')
          s = s.replace('Middleware must protect application routes', 'Proxy must protect application routes')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify full candidate before publishing
        shell: bash
        run: |
          set +e
          status=0
          mkdir -p /tmp/rsjp-candidate

          npm audit --audit-level=high > /tmp/rsjp-candidate/audit.log 2>&1 || status=1
          npm run validate:security > /tmp/rsjp-candidate/security.log 2>&1 || status=1
          npm run lint > /tmp/rsjp-candidate/lint.log 2>&1 || status=1
          npm run typecheck > /tmp/rsjp-candidate/typecheck.log 2>&1 || status=1
          npm run build > /tmp/rsjp-candidate/build.log 2>&1 || status=1

          if [ "$status" -ne 0 ]; then
            {
              echo '# Next 16 candidate diagnostics'
              echo
              for f in audit security lint typecheck build; do
                echo "## $f"
                echo '```text'
                cat "/tmp/rsjp-candidate/$f.log"
                echo '```'
                echo
              done
            } > .github/candidate-diagnostics.md

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/candidate-diagnostics.md
            git commit -m "chore: capture Next 16 candidate diagnostics" || true
            git push origin HEAD:hardening/rsjp-schedule-auth-security-20260823
            exit 1
          fi

      - name: Publish verified candidate and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json eslint.config.mjs proxy.ts scripts/validate-security-boundary.mjs tsconfig.json
          git rm -f --ignore-unmatch middleware.ts .eslintrc.json .github/candidate-diagnostics.md
          git rm -f .github/workflows/generate-next16-candidate.yml
          git commit -m "Security: move RSJP Schedule to audited Next 16.3.2"
          git push origin HEAD:hardening/rsjp-schedule-auth-security-20260823
