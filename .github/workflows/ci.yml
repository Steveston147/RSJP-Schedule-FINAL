name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - hardening/rsjp-schedule-auth-security-20260823

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-ui-label:
    if: github.event_name == 'push' && github.ref == 'refs/heads/hardening/rsjp-schedule-auth-security-20260823' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/rsjp-schedule-auth-security-20260823
      - name: Apply label and restore normal CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/ScheduleApp.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''                    <input
                      type="number"
                      value={selectedProgram.studentsCount}
                      onChange={(e) => updateProgram({ studentsCount: clamp(Number(e.target.value), 1, 999) })}
                      placeholder="留学生数"
                    />'''
          new = '''                    <label style={{ display: "flex", alignItems: "center", gap: 8, whiteSpace: "nowrap" }}>
                      <span style={{ fontSize: 12, opacity: 0.75 }}>留学生数</span>
                      <input
                        type="number"
                        value={selectedProgram.studentsCount}
                        onChange={(e) => updateProgram({ studentsCount: clamp(Number(e.target.value), 1, 999) })}
                        aria-label="留学生数"
                        style={{ width: "100%", minWidth: 0 }}
                      />
                      <span style={{ fontSize: 12, opacity: 0.75 }}>人</span>
                    </label>'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one studentsCount input block, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          Path('.github/workflows/ci.yml').write_text('''name: CI\n\non:\n  pull_request:\n    branches: [main]\n  push:\n    branches:\n      - main\n      - hardening/rsjp-schedule-auth-security-20260823\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: ci-${{ github.workflow }}-${{ github.ref }}\n  cancel-in-progress: true\n\njobs:\n  verify:\n    name: Quality Gate\n    runs-on: ubuntu-latest\n    timeout-minutes: 12\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: 20\n          cache: npm\n\n      - name: Install deterministic dependencies\n        run: npm ci\n\n      - name: Reject high-severity dependency vulnerabilities\n        run: npm audit --audit-level=high\n\n      - name: Validate security boundary\n        run: npm run validate:security\n\n      - name: Lint\n        run: npm run lint\n\n      - name: Typecheck\n        run: npm run typecheck\n\n      - name: Build\n        run: npm run build\n''', encoding='utf-8')
          PY
          rm -f .github/workflows/final-ui-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ScheduleApp.tsx .github/workflows/ci.yml
          git add -u .github/workflows/final-ui-label.yml
          git commit -m "UI: label RSJP Schedule student count field"
          git push origin HEAD:hardening/rsjp-schedule-auth-security-20260823

  verify:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deterministic dependencies
        run: npm ci
      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Validate security boundary
        run: npm run validate:security
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
